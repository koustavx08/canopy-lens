# CanopyLens CI
# ---------------------------------------------------------------------------
# Four checks: lint and the default suite, a production build of the frontend,
# both container images, and the deep-learning engine actually running.
#
# The default suite does not install the optional extras (requirements-ml.txt,
# torch and weights). It is written so an absent engine reports itself
# unavailable rather than failing, which keeps the run in minutes and proves
# the configuration the deployed image actually ships.
#
# The engine still has to be exercised somewhere, or the path a server takes
# with the extras installed is never executed by anything. That is the `ml`
# job: it installs CPU torch, runs only the tests marked `slow`, and caches
# both the wheels and the downloaded weights so repeat runs are not spent
# fetching the same two hundred megabytes.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version the project is developed against and the one the API
          # image ships; no matrix until a second version is actually supported.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend ml tests

      - name: Pytest
        run: pytest

  ml:
    name: Detection engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-ml.txt

      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          # Fetched from Hugging Face on first use. Keyed on the requirements
          # file because the model a DeepForest release pulls is part of what
          # that release is.
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/requirements-ml.txt') }}

      - name: Install dependencies, deep-learning extras included
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          # CPU wheels: the runner has no GPU, and the CUDA build is several
          # gigabytes of driver support that would never be loaded.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-ml.txt

      - name: Pytest, the slow tests only
        # The rest of the suite ran in the `backend` job without the extras,
        # which is the configuration that matters there. Running it again here
        # would test the same code twice and the engine no more thoroughly.
        run: pytest -m slow

  frontend:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
      - run: npm run build

  docker:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
