[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() in a parameter default is FastAPI's documented dependency-injection
# pattern, not the mutable-default bug B008 exists to catch.
"app/routers/*.py" = ["B008"]
"app/main.py" = ["B008"]
